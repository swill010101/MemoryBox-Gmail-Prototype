<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MemoryBox — Explore</title>
  <link rel="stylesheet" href="/static/explore/explore.css" />
</head>
<body>
  <div class="mb-explore" id="mb-explore-root">
    <header class="mb-explore-top">
      <div class="mb-explore-brand">
        <div class="mb-explore-mark" aria-hidden="true"></div>
        <div>
          <div class="mb-explore-brand-name">MemoryBox</div>
          <div class="mb-explore-tagline">Life doesn’t live in folders.</div>
        </div>
      </div>
      <nav class="mb-explore-nav" id="mb-explore-nav" aria-label="Family"></nav>
    </header>

    <div class="mb-explore-ask-row">
      <label class="mb-explore-ask-label" for="mb-explore-ask">What would you like to see?</label>
      <div class="mb-explore-ask-field">
        <input
          id="mb-explore-ask"
          type="text"
          autocomplete="off"
          placeholder="Ask MemoryBox… e.g. Only photos. Show 2005 through 2011."
        />
        <button type="button" class="mb-explore-ask-go" id="mb-explore-ask-go">Ask</button>
      </div>
    </div>

    <section class="mb-explore-curator" id="mb-explore-curator" aria-live="polite">
      <h1 id="mb-explore-curator-title">—</h1>
      <p id="mb-explore-curator-body">—</p>
      <div class="mb-explore-chips" id="mb-explore-chips"></div>
    </section>

    <div class="mb-explore-toolbar">
      <div class="mb-explore-filters" id="mb-explore-filters" role="group" aria-label="Type filters"></div>
      <div class="mb-explore-density" aria-label="Gallery size">
        <span>Gallery Size</span>
        <button type="button" id="mb-density-minus" title="More / smaller items">−</button>
        <button type="button" id="mb-density-plus" title="Fewer / larger items">+</button>
      </div>
    </div>

    <div class="mb-explore-gallery" id="mb-explore-gallery" tabindex="0" aria-label="Mixed-media gallery"></div>
    <p class="mb-explore-meta" id="mb-explore-meta"></p>

    <section class="mb-explore-timeline" aria-label="Unified timeline">
      <div class="mb-tl-head">
        <span>Timeline</span>
        <div class="mb-tl-actions">
          <span class="mb-tl-range-label" id="mb-tl-range-label">—</span>
          <button type="button" class="mb-tl-reset" id="mb-tl-reset">Reset</button>
        </div>
      </div>
      <div class="mb-tl-track" id="mb-tl-track">
        <div class="mb-tl-rail"></div>
        <div class="mb-tl-dots" id="mb-tl-dots"></div>
        <div class="mb-tl-band" id="mb-tl-band"></div>
        <div class="mb-tl-playhead" id="mb-tl-playhead"></div>
        <button type="button" class="mb-tl-handle" id="mb-tl-handle-l" aria-label="Range start"></button>
        <button type="button" class="mb-tl-handle" id="mb-tl-handle-r" aria-label="Range end"></button>
      </div>
      <div class="mb-tl-ticks" id="mb-tl-ticks"></div>
    </section>
  </div>

  <div class="mb-modal-backdrop" id="mb-modal" hidden>
    <div class="mb-modal" role="dialog" aria-modal="true" aria-labelledby="mb-modal-title">
      <div class="mb-modal-chrome">
        <div>
          <div class="mb-modal-kicker" id="mb-modal-kicker">Evidence</div>
          <h2 class="mb-modal-title" id="mb-modal-title">—</h2>
        </div>
        <button type="button" class="mb-modal-close" id="mb-modal-close">Close</button>
      </div>
      <div class="mb-modal-body" id="mb-modal-body"></div>
      <div class="mb-modal-teach" id="mb-modal-teach">
        Teach / Learn actions will attach here for confirmed people, faces (photos &amp; paused video frames), and voice evidence — without leaving this workspace.
      </div>
    </div>
  </div>

  <script src="/static/explore/explore.js"></script>
</body>
</html>
