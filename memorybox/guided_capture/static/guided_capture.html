<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Guided Capture — MemoryBox</title>
  <style>
    :root { --bg:#f6f3ee; --ink:#1c1917; --muted:#78716c; --line:#d6d3d1; --acc:#0f766e; --warn:#b45309; }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); background: #fff; display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
    header h1 { font-size: 1.15rem; margin: 0; }
    header .badge { background: #fef3c7; color: var(--warn); padding: .15rem .5rem; border-radius: 4px; font-size: .85rem; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background: #fff; border: 1px solid var(--line); padding: 1rem; }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    label { display:block; font-size:.8rem; color:var(--muted); margin-top:.5rem; }
    input, textarea, select, button { font: inherit; }
    input, textarea, select { width: 100%; padding: .4rem .5rem; border: 1px solid var(--line); background:#fff; }
    textarea { min-height: 6rem; }
    button { margin-top: .5rem; margin-right: .35rem; padding: .4rem .7rem; background: var(--acc); color:#fff; border:0; cursor:pointer; }
    button.secondary { background: #44403c; }
    button.warn { background: #b45309; }
    .muted { color: var(--muted); font-size: .85rem; }
    .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:end; }
    .row > * { flex: 1; min-width: 8rem; }
    ul.list { list-style:none; padding:0; margin:0; }
    ul.list li { border-top: 1px solid var(--line); padding: .55rem 0; cursor:pointer; }
    ul.list li:hover { background: #fafaf9; }
    .pill { display:inline-block; font-size:.75rem; padding:.1rem .4rem; border:1px solid var(--line); border-radius:3px; margin-right:.25rem; }
    #status { padding: .5rem 1.25rem; font-size:.9rem; }
    .err { color: #b91c1c; }
    audio { width: 100%; margin-top: .5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Guided Capture</h1>
    <span class="badge" id="newBadge">New responses: 0</span>
    <span class="muted">Time-driven campaigns · thin review · credibility</span>
  </header>
  <p id="status" class="muted"></p>
  <main>
    <section>
      <h2>Campaigns</h2>
      <div class="row">
        <div>
          <label>Respondent name</label>
          <input id="cName" placeholder="Rick" />
        </div>
        <div>
          <label>Email (no MB account required)</label>
          <input id="cEmail" placeholder="rick@example.com" />
        </div>
      </div>
      <label>Title</label>
      <input id="cTitle" placeholder="Family interview" />
      <div class="row">
        <div>
          <label>Cadence (seconds)</label>
          <input id="cCadence" type="number" value="120" min="1" />
        </div>
        <div>
          <label>Starter pack</label>
          <button type="button" class="secondary" id="btnStarter">Load starters</button>
        </div>
      </div>
      <label>Questions (one per line)</label>
      <textarea id="cQuestions" placeholder="Question 1&#10;Question 2&#10;Question 3"></textarea>
      <button type="button" id="btnCreate">Create draft</button>
      <button type="button" id="btnStart">Start</button>
      <button type="button" class="secondary" id="btnPause">Pause</button>
      <button type="button" class="secondary" id="btnResume">Resume</button>
      <button type="button" class="warn" id="btnStop">Stop</button>
      <button type="button" class="secondary" id="btnTick">Tick scheduler</button>
      <button type="button" class="secondary" id="btnPoll">Poll inbound email</button>
      <p class="muted" id="campMeta"></p>
      <ul class="list" id="campList"></ul>
      <div id="campDetail"></div>
    </section>
    <section>
      <h2>Response review</h2>
      <p class="muted">Open · read/play · correct transcript (audio immutable) · credibility · mark reviewed</p>
      <ul class="list" id="respList"></ul>
      <div id="respDetail"></div>
    </section>
  </main>
  <script>
    const CRED = [
      ["not_rated", "Not rated"],
      ["trust_strongly", "Trust strongly"],
      ["generally_trust", "Generally trust"],
      ["uncertain", "Uncertain"],
      ["doubt", "Doubt"],
      ["believe_incorrect", "Believe incorrect"],
    ];
    let selectedCampaign = null;
    let selectedResponse = null;

    function status(msg, err) {
      const el = document.getElementById("status");
      el.textContent = msg || "";
      el.className = err ? "err" : "muted";
    }

    async function api(path, opts) {
      const r = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts && opts.headers || {}) },
        ...opts,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || data.error || r.statusText);
      return data;
    }

    async function refreshBadge() {
      const d = await api("/guided-capture/new-count");
      document.getElementById("newBadge").textContent = `New responses: ${d.count ?? 0}`;
    }

    async function loadCampaigns() {
      const d = await api("/guided-capture/campaigns");
      const ul = document.getElementById("campList");
      ul.innerHTML = "";
      (d.campaigns || []).forEach(c => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="pill">${c.status}</span> <strong>${c.title || "(untitled)"}</strong>
          · ${c.respondent_name} &lt;${c.respondent_email}&gt;
          · new ${c.new_response_count}`;
        li.onclick = () => selectCampaign(c.id);
        ul.appendChild(li);
      });
    }

    async function selectCampaign(id) {
      const c = await api(`/guided-capture/campaigns/${id}`);
      selectedCampaign = c;
      document.getElementById("campMeta").textContent =
        `${c.id} · ${c.status} · cadence ${c.cadence_seconds}s · mode ${c.send_mode}`;
      const det = document.getElementById("campDetail");
      const qs = (c.questions || []).map(q =>
        `<li><span class="pill">${q.status}</span> ${q.body_text}
         ${q.status === "active" ? `<button data-skip="${q.id}" class="secondary">Skip</button>` : ""}</li>`
      ).join("");
      const ds = (c.deliveries || []).map(d =>
        `<li><span class="pill">${d.status}</span> q=${d.question_id.slice(0,8)} · sched ${d.scheduled_for || ""} · sent ${d.sent_at || ""} ${d.fail_detail || ""}</li>`
      ).join("");
      det.innerHTML = `<h3>Questions</h3><ul class="list">${qs}</ul><h3>Deliveries</h3><ul class="list">${ds}</ul>`;
      det.querySelectorAll("[data-skip]").forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          await api(`/guided-capture/questions/${btn.dataset.skip}/skip`, { method: "POST", body: "{}" });
          await selectCampaign(id);
          await loadCampaigns();
        };
      });
    }

    async function loadResponses() {
      const d = await api("/guided-capture/responses?limit=50");
      const ul = document.getElementById("respList");
      ul.innerHTML = "";
      (d.responses || []).forEach(r => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="pill">${r.review_status}</span>
          <span class="pill">${r.credibility}</span>
          <span class="pill">${r.channel}</span>
          <strong>${r.respondent_name || "?"}</strong>
          · ${r.campaign_title || ""} · ${r.received_at || ""}`;
        li.onclick = () => showResponse(r.id);
        ul.appendChild(li);
      });
    }

    async function showResponse(id) {
      const r = await api(`/guided-capture/responses/${id}`);
      selectedResponse = r;
      const det = document.getElementById("respDetail");
      const credOpts = CRED.map(([v,l]) =>
        `<option value="${v}" ${r.credibility===v?"selected":""}>${l}</option>`
      ).join("");
      det.innerHTML = `
        <p><strong>Question:</strong> ${escapeHtml(r.question_body || "")}</p>
        <p><strong>Respondent:</strong> ${escapeHtml(r.respondent_name || "")} &lt;${escapeHtml(r.respondent_email || "")}&gt;</p>
        <p class="muted">Campaign ${escapeHtml(r.campaign_title || "")} (${r.campaign_status}) · received ${r.received_at}</p>
        <label>Typed / extracted text</label>
        <textarea readonly>${escapeHtml(r.extracted_text || "")}</textarea>
        <label>Transcript (correctable; audio immutable)</label>
        <textarea id="txEdit">${escapeHtml(r.transcript_text || "")}</textarea>
        ${r.audio_uri ? `<audio controls src="/guided-capture/responses/${r.id}/audio"></audio>` : ""}
        <p class="muted">STT: ${r.stt_status} · audio_uri preserved: ${r.audio_uri ? "yes" : "no"}</p>
        <label>Credibility</label>
        <select id="credSel">${credOpts}</select>
        <div>
          <button type="button" id="btnSaveTx">Save transcript correction</button>
          <button type="button" id="btnCred">Set credibility</button>
          <button type="button" id="btnReviewed">Mark reviewed</button>
        </div>
      `;
      document.getElementById("btnSaveTx").onclick = async () => {
        await api(`/guided-capture/responses/${id}/transcript`, {
          method: "POST",
          body: JSON.stringify({ text: document.getElementById("txEdit").value }),
        });
        status("Transcript corrected (new version); audio unchanged");
        await showResponse(id);
        await loadResponses();
      };
      document.getElementById("btnCred").onclick = async () => {
        await api(`/guided-capture/responses/${id}/credibility`, {
          method: "POST",
          body: JSON.stringify({ credibility: document.getElementById("credSel").value }),
        });
        status("Credibility saved (testimony unchanged)");
        await showResponse(id);
        await loadResponses();
        await refreshBadge();
      };
      document.getElementById("btnReviewed").onclick = async () => {
        await api(`/guided-capture/responses/${id}/reviewed`, { method: "POST", body: "{}" });
        status("Marked reviewed");
        await showResponse(id);
        await loadResponses();
        await refreshBadge();
      };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    document.getElementById("btnStarter").onclick = async () => {
      const d = await api("/guided-capture/starter-questions");
      document.getElementById("cQuestions").value = (d.questions || []).join("\n");
    };

    document.getElementById("btnCreate").onclick = async () => {
      try {
        const questions = document.getElementById("cQuestions").value.split("\n").map(s => s.trim()).filter(Boolean);
        const d = await api("/guided-capture/campaigns", {
          method: "POST",
          body: JSON.stringify({
            display_name: document.getElementById("cName").value,
            email: document.getElementById("cEmail").value,
            title: document.getElementById("cTitle").value,
            cadence_seconds: Number(document.getElementById("cCadence").value || 120),
            questions,
          }),
        });
        status(`Created draft ${d.id}`);
        await loadCampaigns();
        await selectCampaign(d.id);
      } catch (e) { status(String(e.message || e), true); }
    };

    async function campAction(path) {
      if (!selectedCampaign) { status("Select a campaign", true); return; }
      try {
        const d = await api(`/guided-capture/campaigns/${selectedCampaign.id}/${path}`, {
          method: "POST", body: "{}",
        });
        status(`${path}: ${d.status}`);
        await selectCampaign(d.id);
        await loadCampaigns();
      } catch (e) { status(String(e.message || e), true); }
    }
    document.getElementById("btnStart").onclick = () => campAction("start");
    document.getElementById("btnPause").onclick = () => campAction("pause");
    document.getElementById("btnResume").onclick = () => campAction("resume");
    document.getElementById("btnStop").onclick = () => campAction("stop");
    document.getElementById("btnTick").onclick = async () => {
      const d = await api("/guided-capture/tick", { method: "POST", body: "{}" });
      status(`Tick sent=${(d.sent||[]).length} failed=${(d.failed||[]).length}`);
      if (selectedCampaign) await selectCampaign(selectedCampaign.id);
      await loadCampaigns();
    };
    document.getElementById("btnPoll").onclick = async () => {
      const d = await api("/guided-capture/poll", { method: "POST", body: "{}" });
      status(`Poll created=${(d.created||[]).length} quarantined=${(d.quarantined||[]).length}`);
      await refreshBadge();
      await loadResponses();
    };

    (async () => {
      try {
        await refreshBadge();
        await loadCampaigns();
        await loadResponses();
      } catch (e) { status(String(e.message || e), true); }
    })();
  </script>
</body>
</html>
