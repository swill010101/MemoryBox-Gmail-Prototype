<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MemoryBox — Artifacts</title>
  <link rel="stylesheet" href="/static/explore/explore.css?v=i10b-1" />
  <style>
    :root {
      --ink: #e8edf5; --muted: #9aa3b5; --blue: #3b82f6; --green: #3dcf9a;
      --orange: #fb923c; --line: rgba(255,255,255,0.12); --card: #1a2230; --page: #0f141c;
      --display: "Newsreader", Georgia, serif; --ui: "Figtree", "Segoe UI", system-ui, sans-serif;
    }
    html[data-mb-surface="artifact"] .mb-site-bar,
    html[data-mb-surface="artifact"] .mb-nav-system { display: none !important; }
    html[data-mb-surface="artifact"] body { background: var(--page) !important; color: var(--ink) !important; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--ui); background: #0f141c; color: #e8edf5; }
    a { color: #93c5fd; }
    button { font: inherit; cursor: pointer; }
    input, textarea, select {
      font: inherit; color: var(--ink); background: #141b27; border: 1px solid var(--line);
      border-radius: 10px; padding: 0.55rem 0.75rem; width: 100%;
    }
    textarea { min-height: 5rem; resize: vertical; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 1.25rem 3rem; }
    h1 { font-family: var(--display); font-size: 2.1rem; margin: 0; }
    .sub { color: var(--muted); margin: 0.25rem 0 0; }
    .btn { border-radius: 10px; padding: 0.5rem 0.9rem; border: 1px solid var(--line); background: #141b27; color: var(--ink); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.danger { color: #fca5a5; border-color: rgba(252,165,165,0.3); background: transparent; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; margin: 1.4rem 0 1rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.8rem 0 1rem; }
    .tabs button { border: 0; background: #141b27; color: var(--muted); padding: 0.4rem 0.75rem; border-radius: 999px; }
    .tabs button.on { background: var(--blue); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; }
    .card .thumb { height: 140px; background: #111827; }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card .body { padding: 0.8rem 0.9rem; }
    .card h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 0.3rem; }
    .card p { color: var(--muted); font-size: 0.82rem; margin: 0 0 0.4rem; }
    .crumb { color: var(--muted); font-size: 0.85rem; margin: 1rem 0 0.4rem; }
    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.2rem; }
    .side { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem; margin-bottom: 0.8rem; }
    .side h4 { margin: 0 0 0.6rem; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--muted); }
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.55rem; font-size: 0.75rem; margin-right: 0.3rem; }
    .mem { display: flex; gap: 0.7rem; align-items: center; background: #141b27; border: 1px solid var(--line); border-radius: 12px; padding: 0.55rem; margin: 0.5rem 0; }
    .mem img { width: 88px; height: 66px; object-fit: cover; border-radius: 8px; background: #0f141c; }
    .dash { border: 1px dashed var(--line); border-radius: 12px; padding: 1.2rem; text-align: center; color: var(--muted); }
    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.62); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 1.2rem; }
    .modal { width: min(880px, 100%); max-height: 92vh; overflow: auto; background: #121826; border: 1px solid var(--line); border-radius: 16px; padding: 1rem; }
    .hidden { display: none !important; }
    .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; }
    .warn { color: #fdba74; }
    .chip { display: inline-flex; align-items: center; gap: 0.4rem; background: #111827; border-radius: 999px; padding: 0.2rem 0.55rem; margin: 0.15rem; }
    .editor-foot { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 0.6rem; padding: 0.75rem 1.25rem; background: #0c1118; border-top: 1px solid var(--line); }
    .viewer { background: #111827; border-radius: 14px; min-height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .viewer img { max-width: 100%; max-height: 360px; object-fit: contain; }
    .pick { background: #141b27; border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem; cursor: pointer; }
    .pick.on { outline: 2px solid var(--blue); }
    .pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
    @media (max-width: 900px) { .grid, .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="mb-explore" id="mb-art-chrome">
    <header class="mb-explore-top">
      <a class="mb-explore-brand" href="/explore/ui">
        <div class="mb-explore-mark" aria-hidden="true"></div>
        <div>
          <div class="mb-explore-brand-name">MemoryBox</div>
          <div class="mb-explore-tagline">Life doesn’t live in folders.</div>
        </div>
      </a>
      <nav class="mb-explore-nav" id="mb-explore-nav" aria-label="Family"></nav>
    </header>
    <section class="mb-explore-ask-band">
      <div class="mb-explore-ask-row">
        <label class="mb-explore-ask-label" for="askQ">What would you like to see?</label>
        <div class="mb-explore-ask-field">
          <span class="mb-explore-ask-spark" aria-hidden="true">✦</span>
          <input id="askQ" type="text" placeholder="Ask about a keepsake, document, recipe, or meaningful thing" />
          <button type="button" class="mb-explore-ask-go" id="askGo">→</button>
        </div>
      </div>
    </section>
  </div>
  <div id="view" class="wrap"></div>
  <div id="modals"></div>
  <div id="editor-foot" class="editor-foot hidden"></div>
  <script>
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
    const KINDS = [
      ["keepsake_object", "Keepsake / object"],
      ["letter", "Letter"],
      ["document", "Document"],
      ["recipe_card", "Recipe card"],
      ["clipping", "Clipping"],
      ["photograph_of_object", "Photograph of object"],
      ["other", "Other"],
    ];
    const state = {
      view: "panel", items: [], people: [], owner: null, artifact: null,
      filters: { q: "", kind_group: "", needs_context: false, person_id: "" },
      draft: emptyDraft(), staged: [],
    };
    function emptyDraft() {
      return {
        kind: "keepsake_object", label: "", description: "", visibility: "private",
        described_start_date: "", described_precision: "unknown", place_label: "",
        person_ids: [], memories: [],
      };
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    async function j(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data.detail && (data.detail.message || data.detail)) || res.statusText);
      return data;
    }
    const NAV = [
      { id: "ask", label: "Ask", href: "/explore/ui", ico: "?" },
      { id: "people", label: "People", href: "/people/ui", ico: "☺" },
      { id: "stories", label: "Stories", href: "/story/ui", ico: "❧" },
      { id: "journal", label: "Journal", href: "/journal/ui", ico: "✎" },
      { id: "artifacts", label: "Artifacts", href: "/artifact/ui", ico: "◇" },
      { id: "family-night", label: "Family Night", href: "/family-night/ui", ico: "✧" },
      { id: "teach", label: "Review & Learn", href: "/review/ui", ico: "✧" },
    ];
    function renderNav() {
      const el = document.getElementById("mb-explore-nav");
      if (!el) return;
      el.innerHTML = NAV.map((n) =>
        `<a class="mb-explore-nav-link${n.id === "artifacts" ? " is-active" : ""}" href="${n.href}"><span>${n.ico}</span> ${n.label}</a>`
      ).join("");
    }
    async function loadPeople() {
      try {
        const data = await j("/library/person-options?limit=300");
        state.people = data.people || [];
      } catch (_) {
        try { state.people = (await j("/people?limit=300")).people || []; } catch (e) { state.people = []; }
      }
    }
    async function loadOwner() {
      try { state.owner = await j("/people/owner"); } catch (_) { state.owner = null; }
    }
    function personName(id) {
      const p = state.people.find((x) => x.id === id);
      return (p && p.display_name) || "Person";
    }
    function subtitle(a) {
      if (a.described_start_date && a.described_precision && a.described_precision !== "unknown") {
        const d = String(a.described_start_date).slice(0, 10);
        if (a.described_precision === "year" || a.described_precision === "approximate") {
          return (a.described_precision === "approximate" ? "about " : "") + d.slice(0, 4);
        }
        return d;
      }
      const k = KINDS.find((x) => x[0] === a.kind);
      return k ? k[1] : a.kind;
    }
    function primaryThumb(a) {
      const r = (a.representations || []).find((x) => x.presentation === "preview" && x.download_url);
      return r ? r.download_url : "";
    }
    async function loadList() {
      const f = state.filters;
      const qs = new URLSearchParams({ limit: "80" });
      if (f.q) qs.set("q", f.q);
      if (f.kind_group) qs.set("kind_group", f.kind_group);
      if (f.person_id) qs.set("person_id", f.person_id);
      if (f.needs_context) qs.set("needs_context", "true");
      const data = await j("/artifact?" + qs.toString());
      state.items = data.artifacts || [];
    }
    function renderPanel() {
      state.view = "panel";
      document.getElementById("editor-foot").classList.add("hidden");
      const groups = [["", "All"], ["objects", "Objects"], ["documents", "Documents"], ["recipes", "Recipes"], ["other", "Other"]];
      const cards = state.items.map((a) => `
        <article class="card" data-id="${esc(a.id)}">
          <div class="thumb">${primaryThumb(a) ? `<img src="${esc(primaryThumb(a))}" alt="" />` : ""}</div>
          <div class="body">
            <h3>${esc(a.label)}</h3>
            <p>${esc(subtitle(a))}</p>
            <p>${esc((a.people || []).map((p) => p.display_name).join(", "))}</p>
            <p>${(a.memories || []).length} memories · ${(a.stories || a.story_ids || []).length} stories${a.place_label ? " · " + esc(a.place_label) : ""}</p>
            ${a.needs_representation ? `<span class="badge">Needs representation</span>` : ""}
            ${a.needs_context && !a.needs_representation ? `<span class="badge">Needs context</span>` : ""}
          </div>
        </article>`).join("");
      document.getElementById("view").innerHTML = `
        <div class="page-head">
          <div><h1>Artifacts</h1><p class="sub">The meaningful things—and the stories they carry.</p></div>
          <button class="btn primary" id="add-art">+ Add artifact</button>
        </div>
        <div class="filters">
          <input id="art-q" placeholder="Search artifacts" value="${esc(state.filters.q)}" style="max-width:220px" />
          <div class="tabs">${groups.map(([k, lab]) => `<button type="button" data-g="${k}" class="${state.filters.kind_group===k?"on":""}">${lab}</button>`).join("")}</div>
          <button type="button" class="btn ${state.filters.needs_context?"primary":""}" id="needs">Needs context</button>
        </div>
        <div class="grid">${cards || `<p class="empty">No artifacts yet.</p>`}</div>
        <p class="sub" style="text-align:center;margin-top:2rem">Artifacts remain distinct objects with their own evidence, people, places, stories, and history.</p>`;
      document.getElementById("add-art").onclick = () => openEditor(null);
      document.getElementById("art-q").onchange = async (e) => { state.filters.q = e.target.value; await loadList(); renderPanel(); };
      document.querySelectorAll(".tabs button").forEach((b) => {
        b.onclick = async () => { state.filters.kind_group = b.getAttribute("data-g"); await loadList(); renderPanel(); };
      });
      document.getElementById("needs").onclick = async () => {
        state.filters.needs_context = !state.filters.needs_context; await loadList(); renderPanel();
      };
      document.querySelectorAll(".card").forEach((c) => {
        c.onclick = () => openDetail(c.getAttribute("data-id"));
      });
    }
    function renderDetail(a) {
      state.view = "detail";
      state.artifact = a;
      document.getElementById("editor-foot").classList.add("hidden");
      const reps = a.representations || [];
      const first = reps[0];
      const people = (a.people || []).map((p) => `<span class="chip">${esc(p.display_name)}</span>`).join(" ");
      const stories = (a.stories || []).map((s) => `
        <a class="mem" href="/story/ui?id=${esc(s.id)}"><div><strong>${esc(s.title)}</strong>
        <p class="sub">${s.narrator_display_name ? "Narrated by " + esc(s.narrator_display_name) : ""} · ${s.ask_available ? "Saved" : "Draft"}</p></div></a>`).join("");
      const mems = (a.memories || []).map((m) => `
        <div class="mem">${m.thumb_url ? `<img src="${esc(m.thumb_url)}" alt="" />` : ""}
          <div><strong>${esc(m.source_kind)} · ${esc(m.label_snapshot || m.source_id)}</strong>
          <p class="sub">${esc(m.occurred_on || "")}</p></div></div>`).join("");
      const img = first && first.presentation === "preview" && first.download_url
        ? `<img src="${esc(first.download_url)}" alt="${esc(first.view_kind)}" />`
        : first ? `<p class="sub">Open original: <a href="${esc(first.download_url)}">${esc(first.original_filename || "file")}</a></p>` : `<p class="sub">No representations yet</p>`;
      document.getElementById("view").innerHTML = `
        <p class="crumb"><a href="#" id="back">Artifacts</a> / ${esc(a.label)}</p>
        <div class="page-head">
          <div>
            <h1>${esc(a.label)}</h1>
            <p><span class="badge">Saved</span><span class="badge">Available to Ask</span></p>
          </div>
          <div>
            <button class="btn danger" id="del">Delete artifact</button>
            <button class="btn primary" id="edit">Edit artifact</button>
          </div>
        </div>
        <div class="layout">
          <div>
            <div class="viewer">${img}</div>
            <p>${esc((a.kind || "") + (subtitle(a) ? " · " + subtitle(a) : "") + (a.place_label ? " · " + a.place_label : ""))}</p>
            <p>${esc(a.description || "")}</p>
            <h3>People</h3><p>${people || "<span class='sub'>None</span>"}</p>
            <h3>Stories</h3>${stories || "<p class='sub'>No stories yet.</p>"}
            <p>
              <button class="btn" id="add-story">+ Add story</button>
              <button class="btn" id="tell">Tell its story</button>
              <button class="btn" id="link-story">Link existing story</button>
            </p>
            <h3>Supporting memories</h3>${mems || "<p class='sub'>None linked.</p>"}
          </div>
          <div>
            <div class="side"><h4>About this artifact</h4>
              <p>Kind · ${esc(a.kind)}</p>
              <p>Date · ${esc(subtitle(a))}</p>
              <p>Place · ${esc(a.place_label || "—")}</p>
              <p>Representations · ${reps.length}</p>
              <p>Visibility · ${a.visibility === "shared_with_family" ? "Shared with family" : "Private"}</p>
            </div>
            <div class="side"><h4>Connections</h4>
              <p>${(a.people||[]).length} person · ${(a.memories||[]).length} memories · ${(a.stories||[]).length} story</p>
              <p class="sub">Original files preserved by MemoryBox.</p>
              <p class="sub">${a.added_by ? "Added by " + esc(a.added_by) : ""} ${a.created_at ? " · " + esc(String(a.created_at).slice(0,10)) : ""}</p>
            </div>
          </div>
        </div>`;
      document.getElementById("back").onclick = async (e) => { e.preventDefault(); await loadList(); renderPanel(); };
      document.getElementById("edit").onclick = () => openEditor(a);
      document.getElementById("del").onclick = async () => {
        if (!confirm("Remove this artifact from MemoryBox? Original files are preserved.")) return;
        await j("/artifact/" + a.id + "/removed", { method: "POST" });
        await loadList(); renderPanel();
      };
      document.getElementById("add-story").onclick = () => {
        location.href = "/story/ui?new=1&artifact=" + encodeURIComponent(a.id);
      };
      document.getElementById("tell").onclick = () => {
        location.href = "/story/ui?new=1&artifact=" + encodeURIComponent(a.id) + "&capture=1";
      };
      document.getElementById("link-story").onclick = () => openLinkStory(a);
    }
    function kindOptions(sel) {
      return KINDS.map(([v, l]) => `<option value="${v}" ${sel===v?"selected":""}>${l}</option>`).join("");
    }
    function openEditor(a) {
      state.view = "editor";
      state.staged = [];
      if (a) {
        state.draft = {
          id: a.id, kind: a.kind, label: a.label, description: a.description || "",
          visibility: a.visibility || "private",
          described_start_date: (a.described_start_date || "").slice(0, 10),
          described_precision: a.described_precision || "unknown",
          place_label: a.place_label || "", person_ids: a.person_ids || [],
        };
        state.artifact = a;
      } else {
        state.draft = emptyDraft();
        state.artifact = null;
        const p = new URLSearchParams(location.search);
        if (p.get("photo")) state.draft.memories = [{ source_kind: "photo", source_id: p.get("photo"), label_snapshot: p.get("title") || "Photo", thumb_url: p.get("thumb") || "" }];
        if (p.get("video")) state.draft.memories = [{ source_kind: "video", source_id: p.get("video"), label_snapshot: p.get("title") || "Video" }];
      }
      paintEditor();
    }
    function paintEditor() {
      const d = state.draft;
      const a = state.artifact;
      const isNew = !d.id;
      const reps = (a && a.representations) || [];
      const mems = (a && a.memories) || d.memories || [];
      const people = (d.person_ids || []).map((id) => `<span class="chip">${esc(personName(id))} <button type="button" class="btn rem-p" data-id="${esc(id)}">×</button></span>`).join(" ");
      const staged = state.staged.map((s, i) => `<div class="mem"><div>${esc(s.name)} · ${esc(s.view_kind)} <button type="button" class="btn drop-st" data-i="${i}">Remove</button></div></div>`).join("");
      document.getElementById("view").innerHTML = `
        <p class="crumb"><a href="#" id="back">Artifacts</a> / ${isNew ? "New artifact" : esc(d.label) + " / Edit"}</p>
        <h1>${isNew ? "New artifact" : "Edit artifact"}</h1>
        <p class="sub">${isNew ? "Create one meaningful object, then add the views and evidence that help preserve it." : "Update the object and its connections. Original representation files remain unchanged."}</p>
        <div class="layout">
          <div>
            <label>Name</label><input id="ed-label" value="${esc(d.label)}" placeholder="e.g. Grandpa's pocket watch" />
            <label>Description (optional)</label>
            <p class="sub">Describe the object itself. Add recollections as Stories after the artifact is saved.</p>
            <textarea id="ed-desc">${esc(d.description)}</textarea>
            <h3>Representations</h3>
            <p class="sub">${isNew ? "Files stay on this device until Save artifact." : "Originals are preserved."}</p>
            ${reps.map((r) => `<div class="mem">${r.presentation==="preview"&&r.download_url?`<img src="${esc(r.download_url)}" alt="" />`:""}<div><strong>${esc(r.view_kind)}</strong> · ${esc(r.original_filename||"")}<br/><button type="button" class="btn rem-r" data-id="${esc(r.id)}">Remove</button></div></div>`).join("")}
            ${staged}
            ${!reps.length && !state.staged.length ? `<div class="dash">No representations yet</div>` : ""}
            <p><button class="btn primary" id="add-rep">+ Add representation</button></p>
            <p id="up-err" class="warn"></p>
            <h3>Supporting memories</h3>
            ${mems.map((m) => `<div class="mem"><div>${esc(m.source_kind)} · ${esc(m.label_snapshot||m.source_id)} ${m.id?`<button type="button" class="btn rem-m" data-id="${esc(m.id)}">Remove</button>`:""}</div></div>`).join("")}
            <p><button class="btn" id="add-mem">+ Add memories</button></p>
          </div>
          <div>
            <div class="side">
              <h4>Artifact details</h4>
              <label>Kind</label><select id="ed-kind">${kindOptions(d.kind)}</select>
              <label>Approximate date</label>
              <select id="ed-prec">
                ${[["unknown","Unknown"],["day","Exact day"],["month","Month"],["year","Year"],["approximate","Approximate year"]].map(([v,l])=>`<option value="${v}" ${d.described_precision===v?"selected":""}>${l}</option>`).join("")}
              </select>
              <input id="ed-date" type="date" value="${esc(d.described_start_date)}" />
              <label>Place (optional)</label><input id="ed-place" value="${esc(d.place_label)}" placeholder="Florissant" />
              <label>Visibility</label>
              <select id="ed-vis">
                <option value="private" ${d.visibility==="private"?"selected":""}>Private</option>
                <option value="shared_with_family" ${d.visibility==="shared_with_family"?"selected":""}>Shared with family</option>
              </select>
              <p>People</p>${people || "<p class='sub'>None</p>"}
              <button class="btn" id="add-p">+ Add people</button>
              <p class="sub">${state.owner && state.owner.display_name ? "Added by " + esc(state.owner.display_name) : ""}</p>
            </div>
            <p class="sub">Stories are managed in the Story editor and remain linked to this artifact.</p>
          </div>
        </div>`;
      const foot = document.getElementById("editor-foot");
      foot.classList.remove("hidden");
      foot.innerHTML = `<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">${isNew?"Save artifact":"Save changes"}</button>`;
      document.getElementById("back").onclick = async (e) => { e.preventDefault(); if (isNew) { await loadList(); renderPanel(); } else openDetail(d.id); };
      document.getElementById("cancel").onclick = async () => { state.staged = []; if (isNew) { await loadList(); renderPanel(); } else openDetail(d.id); };
      document.getElementById("save").onclick = saveEditor;
      document.getElementById("add-rep").onclick = () => openRepModal(isNew);
      document.getElementById("add-mem").onclick = () => { if (isNew) return alert("Save the artifact first, then add archive memories — or they will be attached on Save if staged from a photo/video."); openMemModal(); };
      document.getElementById("add-p").onclick = openPeople;
      document.querySelectorAll(".rem-p").forEach((b) => {
        b.onclick = async () => {
          const id = b.getAttribute("data-id");
          if (d.id) { const data = await j("/artifact/" + d.id + "/persons/" + id + "/removed", { method: "POST" }); state.artifact = data.artifact; d.person_ids = data.artifact.person_ids; }
          else d.person_ids = d.person_ids.filter((x) => x !== id);
          paintEditor();
        };
      });
      document.querySelectorAll(".rem-r").forEach((b) => {
        b.onclick = async () => {
          if (!confirm("Remove this representation? The original file is preserved.")) return;
          const data = await j("/artifact/" + d.id + "/representations/" + b.getAttribute("data-id") + "/removed", { method: "POST" });
          state.artifact = data.artifact; paintEditor();
        };
      });
      document.querySelectorAll(".drop-st").forEach((b) => {
        b.onclick = () => { state.staged.splice(Number(b.getAttribute("data-i")), 1); paintEditor(); };
      });
      document.querySelectorAll(".rem-m").forEach((b) => {
        b.onclick = async () => {
          const data = await j("/artifact/" + d.id + "/memories/" + b.getAttribute("data-id") + "/removed", { method: "POST" });
          state.artifact = data.artifact; paintEditor();
        };
      });
      ["ed-label","ed-desc","ed-kind","ed-prec","ed-date","ed-place","ed-vis"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.onchange = el.oninput = () => {
          d.label = document.getElementById("ed-label").value;
          d.description = document.getElementById("ed-desc").value;
          d.kind = document.getElementById("ed-kind").value;
          d.described_precision = document.getElementById("ed-prec").value;
          d.described_start_date = document.getElementById("ed-date").value;
          d.place_label = document.getElementById("ed-place").value;
          d.visibility = document.getElementById("ed-vis").value;
        };
      });
    }
    async function saveEditor() {
      const d = state.draft;
      if (!d.label.trim()) { alert("Name is required."); return; }
      const body = {
        kind: d.kind, label: d.label.trim(), description: d.description,
        visibility: d.visibility, described_precision: d.described_precision,
        described_start_date: d.described_precision === "unknown" ? null : (d.described_start_date || null),
        place_label: d.place_label || null, person_ids: d.person_ids,
      };
      let art;
      if (!d.id) {
        art = (await j("/artifact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).artifact;
        const err = [];
        for (const s of state.staged) {
          const fd = new FormData();
          fd.append("file", s.file, s.name);
          fd.append("view_kind", s.view_kind);
          if (s.label) fd.append("label", s.label);
          if (s.caption) fd.append("caption", s.caption);
          try {
            art = (await j("/artifact/" + art.id + "/representations", { method: "POST", body: fd })).artifact;
          } catch (e) { err.push(s.name + ": " + e.message); }
        }
        for (const m of d.memories || []) {
          try {
            art = (await j("/artifact/" + art.id + "/memories", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(m) })).artifact;
          } catch (e) { err.push(e.message); }
        }
        state.staged = [];
        state.artifact = art;
        if (err.length) {
          alert("Artifact saved. Some uploads failed — retry from Edit.\n" + err.join("\n"));
          openEditor(art);
          document.getElementById("up-err").textContent = err.join(" · ");
          return;
        }
        openDetail(art.id);
        return;
      }
      art = (await j("/artifact/" + d.id + "/revise", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).artifact;
      state.artifact = art;
      openDetail(art.id);
    }
    function openRepModal(localOnly) {
      document.getElementById("modals").innerHTML = `
        <div class="modal-back"><div class="modal">
          <h2>Add another view of this artifact</h2>
          <p class="sub">Representations belong to the artifact. MemoryBox preserves the original file.</p>
          <input id="rep-file" type="file" accept=".jpg,.jpeg,.png,.webp,.gif,.heic,.heif,.pdf,.txt,image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain" />
          <label>Representation type</label>
          <select id="rep-vk">${["front","back","detail","engraving","document","other"].map((v)=>`<option value="${v}">${v}</option>`).join("")}</select>
          <label>Label (optional)</label><input id="rep-lab" placeholder="e.g. Engraving on back" />
          <label>Caption (optional)</label><textarea id="rep-cap" placeholder="What does this view show?"></textarea>
          <p class="sub">The uploaded original is preserved. Labels and captions can be changed later without altering the file.</p>
          <p><button class="btn" id="rep-x">Cancel</button> <button class="btn primary" id="rep-go">Add representation</button></p>
        </div></div>`;
      document.getElementById("rep-x").onclick = () => { document.getElementById("modals").innerHTML = ""; };
      document.getElementById("rep-go").onclick = async () => {
        const file = document.getElementById("rep-file").files[0];
        if (!file) { alert("Choose a file."); return; }
        const rec = { file, name: file.name, view_kind: document.getElementById("rep-vk").value, label: document.getElementById("rep-lab").value, caption: document.getElementById("rep-cap").value };
        document.getElementById("modals").innerHTML = "";
        if (localOnly || !state.draft.id) { state.staged.push(rec); paintEditor(); return; }
        const fd = new FormData();
        fd.append("file", rec.file, rec.name);
        fd.append("view_kind", rec.view_kind);
        if (rec.label) fd.append("label", rec.label);
        if (rec.caption) fd.append("caption", rec.caption);
        const data = await j("/artifact/" + state.draft.id + "/representations", { method: "POST", body: fd });
        state.artifact = data.artifact; paintEditor();
      };
    }
    async function openMemModal() {
      document.getElementById("modals").innerHTML = `
        <div class="modal-back"><div class="modal">
          <h2>Link evidence to ${esc(state.draft.label || "this artifact")}</h2>
          <p class="sub">Search existing memories. They remain independent and their originals stay unchanged.</p>
          <div style="display:flex;gap:0.4rem"><input id="pk-q" placeholder="Search people, places, dates, or memories." /><button class="btn primary" id="pk-go">Search</button></div>
          <div class="tabs" id="pk-tabs"></div>
          <div id="pk-grid" class="pick-grid"></div>
          <p class="sub">These become supporting evidence. Use Add representation for files that are views of the artifact itself.</p>
          <p><button class="btn" id="pk-x">Cancel</button> <button class="btn primary" id="pk-add" disabled>Add memories</button></p>
        </div></div>`;
      const kinds = [["all","Memory"],["photos","Photos"],["videos","Video"],["communications","Communications"],["calendar","Calendar"],["journal","Journal"],["audio","Audio"]];
      let kind = "all"; const selected = {};
      const tabs = document.getElementById("pk-tabs");
      tabs.innerHTML = kinds.map(([k,l]) => `<button type="button" data-k="${k}">${l}</button>`).join("");
      async function search() {
        const map = { photos:"photo", videos:"video", communications:"email_thread,sms_conversation", calendar:"calendar_event", journal:"journal", audio:"audio" };
        const qs = new URLSearchParams({ q: document.getElementById("pk-q").value || "", limit: "80" });
        if (kind !== "all") qs.set("types", map[kind] || kind);
        const data = await j("/story/evidence-search?" + qs.toString());
        const items = (data.items || []).filter((x) => x.source_kind !== "artifact");
        document.getElementById("pk-grid").innerHTML = items.map((it) => {
          const key = it.source_kind + ":" + it.source_id;
          return `<div class="pick ${selected[key]?"on":""}" data-k="${esc(key)}"><strong>${esc(it.source_kind)}</strong><p>${esc(it.label_snapshot || it.title || it.source_id)}</p></div>`;
        }).join("") || "<p class='empty'>Search to find memories.</p>";
        document.querySelectorAll(".pick").forEach((el) => {
          el.onclick = () => { const k = el.getAttribute("data-k"); if (selected[k]) delete selected[k]; else {
            const [sk, ...rest] = k.split(":"); selected[k] = { source_kind: sk, source_id: rest.join(":") };
          } search(); };
        });
        const n = Object.keys(selected).length;
        const add = document.getElementById("pk-add");
        add.disabled = !n; add.textContent = n ? "Add " + n + " memories" : "Add memories";
      }
      tabs.querySelectorAll("button").forEach((b) => { b.onclick = () => { kind = b.getAttribute("data-k"); search(); }; });
      document.getElementById("pk-go").onclick = search;
      document.getElementById("pk-x").onclick = () => { document.getElementById("modals").innerHTML = ""; };
      document.getElementById("pk-add").onclick = async () => {
        let art = state.artifact;
        for (const m of Object.values(selected)) {
          art = (await j("/artifact/" + state.draft.id + "/memories", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(m) })).artifact;
        }
        state.artifact = art; document.getElementById("modals").innerHTML = ""; paintEditor();
      };
    }
    function openPeople() {
      const rows = state.people.map((p) => `<button type="button" class="btn p-row" data-id="${esc(p.id)}">${esc(p.display_name)}</button>`).join("");
      document.getElementById("modals").innerHTML = `<div class="modal-back"><div class="modal"><h2>Add people</h2>${rows}<p><button class="btn" id="px">Close</button></p></div></div>`;
      document.getElementById("px").onclick = () => { document.getElementById("modals").innerHTML = ""; };
      document.querySelectorAll(".p-row").forEach((b) => {
        b.onclick = async () => {
          const id = b.getAttribute("data-id");
          if (state.draft.id) {
            const data = await j("/artifact/" + state.draft.id + "/persons/" + id, { method: "POST" });
            state.artifact = data.artifact; state.draft.person_ids = data.artifact.person_ids;
          } else if (!state.draft.person_ids.includes(id)) state.draft.person_ids.push(id);
          document.getElementById("modals").innerHTML = ""; paintEditor();
        };
      });
    }
    async function openLinkStory(a) {
      const data = await j("/story?limit=80");
      const items = data.stories || data.items || [];
      document.getElementById("modals").innerHTML = `<div class="modal-back"><div class="modal"><h2>Link existing story</h2>
        ${items.map((s) => `<button class="btn s-row" data-id="${esc(s.id)}" style="display:block;margin:0.3rem 0">${esc(s.title || "Untitled")}</button>`).join("")}
        <p><button class="btn" id="sx">Cancel</button></p></div></div>`;
      document.getElementById("sx").onclick = () => { document.getElementById("modals").innerHTML = ""; };
      document.querySelectorAll(".s-row").forEach((b) => {
        b.onclick = async () => {
          await j("/artifact/" + a.id + "/stories/" + b.getAttribute("data-id"), { method: "POST" });
          document.getElementById("modals").innerHTML = "";
          openDetail(a.id);
        };
      });
    }
    async function openDetail(id) {
      const data = await j("/artifact/" + id);
      history.replaceState({}, "", "/artifact/ui?id=" + encodeURIComponent(id));
      renderDetail(data.artifact);
    }
    document.getElementById("askGo").onclick = () => {
      location.href = "/explore/ui?q=" + encodeURIComponent(document.getElementById("askQ").value.trim());
    };
    (async function boot() {
      renderNav();
      await Promise.all([loadPeople(), loadOwner()]);
      const p = new URLSearchParams(location.search);
      if (p.get("new") === "1" || p.get("photo") || p.get("video")) { openEditor(null); return; }
      if (p.get("id") && UUID_RE.test(p.get("id"))) { await openDetail(p.get("id")); return; }
      await loadList(); renderPanel();
    })();
  </script>
</body>
</html>
