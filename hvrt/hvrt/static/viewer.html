<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HVRT — Hit Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c2321;
      --muted: #5c6b66;
      --paper: #f3efe6;
      --panel: rgba(255, 252, 246, 0.88);
      --line: rgba(28, 35, 33, 0.12);
      --accent: #0f6b5c;
      --accent-soft: #d7efe9;
      --warn: #8a4b2a;
      --shadow: 0 18px 50px rgba(28, 35, 33, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7f2ee 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #efe6d8 0%, transparent 50%),
        linear-gradient(180deg, #f7f3ea 0%, #ebe4d6 100%);
    }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
      min-height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 1.25rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
    }

    .brand {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 2.75rem);
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1;
    }

    .tagline {
      margin: 0.35rem 0 0;
      color: var(--muted);
      max-width: 36rem;
      font-size: 1.05rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      padding: 1rem 1.1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    select, input[type="search"], button {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0.55rem 0.7rem;
      min-height: 2.5rem;
    }

    select, input[type="search"] { min-width: 12rem; }
    input[type="search"] { min-width: 16rem; }

    button {
      background: var(--accent);
      color: #f7fffc;
      border-color: transparent;
      font-weight: 600;
      cursor: pointer;
      padding-inline: 1rem;
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border-color: rgba(15, 107, 92, 0.35);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .stage {
      display: grid;
      grid-template-columns: minmax(260px, 340px) 1fr;
      gap: 1.1rem;
      min-height: 0;
    }

    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
    }

    .hits, .player {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      min-height: 420px;
    }

    .hits {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .hits h2, .player h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    .hit-meta {
      padding: 0 1rem 0.75rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .hit-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      flex: 1;
    }

    .hit-list li button {
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 0.85rem 1rem;
      display: grid;
      gap: 0.2rem;
      font-weight: 400;
    }
    .hit-list li button:hover { background: var(--accent-soft); }
    .hit-list li button.active {
      background: var(--accent);
      color: #f7fffc;
    }
    .hit-list .title { font-weight: 600; }
    .hit-list .sub { font-size: 0.9rem; opacity: 0.85; }

    .player {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-body {
      padding: 1rem;
      display: grid;
      gap: 0.85rem;
      align-content: start;
    }

    video {
      width: 100%;
      max-height: min(62vh, 640px);
      background: #111814;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    .evidence {
      display: grid;
      gap: 0.25rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .evidence strong { color: var(--ink); font-weight: 600; }

    .empty {
      padding: 1.25rem 1rem;
      color: var(--muted);
    }

    .err {
      color: var(--warn);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 class="brand">HVRT</h1>
        <p class="tagline">Pick an evidence hit. Jump straight to that moment in the video.</p>
      </div>
    </header>

    <div class="controls">
      <label>
        Mode
        <select id="mode">
          <option value="faces">Faces</option>
          <option value="text">Spoken text</option>
        </select>
      </label>
      <label id="personWrap">
        Person
        <select id="person"></select>
      </label>
      <label id="textWrap" hidden>
        Phrase
        <input id="phrase" type="search" placeholder="Happy Birthday" value="Happy Birthday" />
      </label>
      <button id="loadBtn" type="button">Load hits</button>
      <button id="vlcBtn" class="secondary" type="button" disabled>Copy VLC command</button>
    </div>

    <div class="stage">
      <section class="hits" aria-label="Hits">
        <h2>Hits</h2>
        <div id="hitMeta" class="hit-meta">Load a person or phrase to begin.</div>
        <div id="hitErr" class="err" hidden></div>
        <ul id="hitList" class="hit-list"></ul>
      </section>

      <section class="player" aria-label="Playback">
        <h2>Playback</h2>
        <div class="player-body">
          <video id="video" controls playsinline></video>
          <div id="evidence" class="evidence">
            <div>Select a hit to play from its timestamp.</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const modeEl = document.getElementById("mode");
    const personEl = document.getElementById("person");
    const phraseEl = document.getElementById("phrase");
    const personWrap = document.getElementById("personWrap");
    const textWrap = document.getElementById("textWrap");
    const loadBtn = document.getElementById("loadBtn");
    const vlcBtn = document.getElementById("vlcBtn");
    const hitList = document.getElementById("hitList");
    const hitMeta = document.getElementById("hitMeta");
    const hitErr = document.getElementById("hitErr");
    const video = document.getElementById("video");
    const evidence = document.getElementById("evidence");

    let hits = [];
    let selected = null;

    function fmtTime(sec) {
      const s = Math.max(0, Number(sec) || 0);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = Math.floor(s % 60);
      if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`;
      return `${m}:${String(r).padStart(2,"0")}`;
    }

    function showErr(msg) {
      hitErr.hidden = !msg;
      hitErr.textContent = msg || "";
    }

    function syncMode() {
      const faces = modeEl.value === "faces";
      personWrap.hidden = !faces;
      textWrap.hidden = faces;
    }

    async function loadPeople() {
      const res = await fetch("/api/people");
      if (!res.ok) throw new Error("Could not load people from database");
      const data = await res.json();
      personEl.innerHTML = "";
      for (const p of data.people || []) {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = `${p.name} (${p.hit_count})`;
        personEl.appendChild(opt);
      }
      const rick = [...personEl.options].find(o => /rick/i.test(o.value));
      if (rick) personEl.value = rick.value;
    }

    async function loadHits() {
      showErr("");
      selected = null;
      vlcBtn.disabled = true;
      hitList.innerHTML = "";
      video.removeAttribute("src");
      video.load();

      let url;
      if (modeEl.value === "faces") {
        const name = personEl.value;
        if (!name) { showErr("No enrolled people found."); return; }
        url = `/api/hits/faces?name=${encodeURIComponent(name)}`;
      } else {
        const q = phraseEl.value.trim();
        if (!q) { showErr("Enter a phrase to search."); return; }
        url = `/api/hits/text?q=${encodeURIComponent(q)}`;
      }

      const res = await fetch(url);
      if (!res.ok) {
        showErr(`Search failed (${res.status})`);
        return;
      }
      const data = await res.json();
      hits = data.hits || [];
      hitMeta.textContent = `${data.count} hit${data.count === 1 ? "" : "s"} for “${data.query}”.`;

      if (!hits.length) {
        hitList.innerHTML = `<li class="empty">No hits yet. Re-run faces/whisper or widen the query.</li>`;
        evidence.innerHTML = `<div>No evidence selected.</div>`;
        return;
      }

      hits.forEach((hit, idx) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = `
          <span class="title">${escapeHtml(hit.filename)}</span>
          <span class="sub">${fmtTime(hit.start_sec)} → ${fmtTime(hit.end_sec)} · conf ${Number(hit.confidence ?? 0).toFixed(3)}</span>
          <span class="sub">${escapeHtml(hit.label || "")}</span>`;
        btn.addEventListener("click", () => selectHit(idx, btn));
        li.appendChild(btn);
        hitList.appendChild(li);
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function selectHit(idx, btn) {
      selected = hits[idx];
      hitList.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      vlcBtn.disabled = false;

      evidence.innerHTML = `
        <div><strong>${escapeHtml(selected.filename)}</strong></div>
        <div>${escapeHtml(selected.label || "")}</div>
        <div>Start <strong>${fmtTime(selected.start_sec)}</strong> (${selected.start_sec.toFixed(2)}s)
          · End <strong>${fmtTime(selected.end_sec)}</strong>
          · Confidence <strong>${Number(selected.confidence ?? 0).toFixed(3)}</strong></div>
        <div>Model ${escapeHtml(selected.model_version || "—")} · ${escapeHtml(selected.processed_at || "")}</div>`;

      const start = Math.max(0, Number(selected.start_sec) || 0);
      const url = `${selected.stream_url}#t=${start}`;
      const onMeta = () => {
        try { video.currentTime = start; } catch (_) {}
        video.play().catch(() => {});
        video.removeEventListener("loadedmetadata", onMeta);
      };
      video.addEventListener("loadedmetadata", onMeta);
      video.src = url;
      video.load();
    }

    vlcBtn.addEventListener("click", async () => {
      if (!selected) return;
      const t = Math.floor(selected.start_sec || 0);
      const cmd = `vlc "${selected.path}" --start-time=${t}`;
      try {
        await navigator.clipboard.writeText(cmd);
        vlcBtn.textContent = "Copied";
        setTimeout(() => { vlcBtn.textContent = "Copy VLC command"; }, 1200);
      } catch {
        prompt("Copy VLC command:", cmd);
      }
    });

    modeEl.addEventListener("change", syncMode);
    loadBtn.addEventListener("click", () => loadHits().catch(e => showErr(e.message)));
    phraseEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadHits().catch(err => showErr(err.message));
    });

    syncMode();
    loadPeople()
      .then(() => loadHits())
      .catch(e => showErr(e.message));
  </script>
</body>
</html>
